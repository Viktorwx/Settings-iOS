name: Build iOS IPA

on:
  workflow_dispatch:  # Permite disparar manualmente no navegador
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15   # ou macos-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Selecionar Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app  # ajuste a versão se necessário

      - name: Instalar certificados e perfil
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Criar variáveis
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Decodificar certificado
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          
          # Decodificar provisioning profile
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          # Criar keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security default-keychain -s $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -t 3600 -u $KEYCHAIN_PATH
          
          # Importar certificado
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          # Instalar provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build Archive + Export IPA
        run: |
          xcodebuild clean archive \
            -project SeuProjeto.xcodeproj \           # ou -workspace SeuProjeto.xcworkspace
            -scheme SeuScheme \                       # nome do scheme
            -archivePath $RUNNER_TEMP/SeuApp.xcarchive \
            -sdk iphoneos \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution: Seu Nome" \
            PROVISIONING_PROFILE_SPECIFIER="Nome do seu Provisioning Profile" \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }}

          # Exportar IPA
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/SeuApp.xcarchive \
            -exportOptionsPlist ExportOptions.plist \   # crie este arquivo no projeto
            -exportPath $RUNNER_TEMP/output

      - name: Upload IPA como artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeuApp-IPA
          path: $RUNNER_TEMP/output/*.ipa
